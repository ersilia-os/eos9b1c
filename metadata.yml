Identifier: eos9b1c
Slug: molport-similarity
Status: In progress
Title: Molport Library Similarity
Description: Retrieves the 100 nearest neighbours of a query molecule in the 
  Molport Screening Compound Database, a set of 5, 322, 863 purchasable 
  compounds indexed by Ersilia. Three learned embeddings are searched 
  independently, namely CLAMP for bioactivity, SAND for 3D shape and Mol-JEPA 
  for predicted biological context, and their rankings are fused into one list. 
  Ersilia built the search with LazySim, which indexes each embedding with 
  turbovec 4-bit quantization.
